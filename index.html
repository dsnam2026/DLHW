<!DOCTYPE html>
<html>

<head>
    <title>공부해라 우민들아</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 26px;
            padding: 18px;
            margin: 5px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "piece of cake" mean?</p>

    <button onclick="checkAnswer('participate')">
        Participate in
    </button>

    <button onclick="checkAnswer('It's a breeze')">
        It's a breeze
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "It's a breeze") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is It's a breeze.";
            }

        }

    </script>

</body>
</html>
